<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup – Grocery Analyzer</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="ga-wrap">
  <div class="ga-bg-dots"></div>
  <div class="ga-border-frame"></div>

  <span class="floatie f1">🥦</span>
  <span class="floatie f2">🛒</span>
  <span class="floatie f3">🍎</span>
  <span class="floatie f4">🥕</span>
  <span class="floatie f5">🧅</span>
  <span class="floatie f6">🍋</span>
  <span class="floatie f7">🫑</span>
  <span class="floatie f8">🥬</span>

  <div class="ga-card">

    <div class="ga-banner">
      <img
        src="https://miro.medium.com/v2/resize:fit:1400/0*I0eib7kRe1y278DY"
        alt="Fresh groceries"
        class="ga-banner-img"
        onerror="this.style.display='none'"
      >
      <div class="ga-banner-overlay"></div>
      <div class="ga-banner-badge">🛒 grocery-analyzer</div>
    </div>

    <div class="ga-body">
      <div class="ga-brand">
        <h2 class="ga-title">Create Account</h2>
        <p class="ga-sub">Sign up to get started</p>
      </div>

      <div class="ga-divider"><span>🌿</span></div>

      <form class="ga-form" id="signupForm">
        <div class="ga-field">
          <label for="name">Name</label>
          <span class="ga-icon">👤</span>
          <input type="text" id="name" placeholder="Your full name" required>
        </div>
        <div class="ga-field">
          <label for="email">Email</label>
          <span class="ga-icon">📧</span>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="ga-field">
          <label for="password">Password</label>
          <span class="ga-icon">🔒</span>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" id="signupBtn">Sign Up</button>
      </form>

      <p class="ga-link">
        Already have an account? <a href="/static/auth/login.html">Login</a>
      </p>
      <div id="message"></div>
    </div>
  </div>
</div>

<script src="/static/auth/auth.js"></script>
</body>
</html>
