<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grocery Nutrition Analyzer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Upload Receipt</h1>

    <form id="uploadForm">
      <input type="file" id="fileInput" accept="image/*" required>
      <button type="submit">Analyze</button>
    </form>

    <div id="loader" class="hidden">Processing...</div>

    <table id="resultTable" class="hidden">
      <thead>
        <tr>
          <th>Item</th>
          <th>Calories</th>
          <th>Protein</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
